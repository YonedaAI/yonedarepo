    <script>
      // The viewer's theme before the first paint (features/shell/theme.ts): an explicit
      // Light or Dark choice; without one CSS follows prefers-color-scheme.
      try {
        var theme = localStorage.getItem('yoneda.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
