name: Node toolchain
description: Pinned Node and pnpm with the locked dependencies installed.
runs:
  using: composite
  steps:
    # pnpm first: setup-node's pnpm cache (the store, keyed on pnpm-lock.yaml) needs it.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: '12.14.0'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.22.0'
        cache: pnpm
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
