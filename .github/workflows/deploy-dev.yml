name: Deploy dev
# For later, when development slows: today dev deploys from the owner's checkout
# (`cargo xtask deploy --env dev`, AGENTS.md), and this workflow stays disabled on GitHub
# until the owner turns it on (`gh workflow enable deploy-dev.yml`).
# By hand only. It builds everything from source at the tip of dev (Wasm, frontend, and the
# runtime image unless its inputs match what dev runs), deploys with the same command and guards
# as a local deploy (xtask refuses unless HEAD is the tip of dev), then runs the smoke. This
# repository is public, so its output goes through tools/ship/quiet.mjs.
on:
  workflow_dispatch:
    inputs:
      allow_active:
        description: Roll containers out even if instances are busy (kills their runs)
        type: boolean
        default: false
permissions:
  contents: read
# A deploy is never cancelled part-way: a second dispatch waits for the first.
concurrency:
  group: deploy-dev
  cancel-in-progress: false
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  deploy:
    name: Deploy dev + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - name: Fetch the tip of dev for the deploy guard
        run: git fetch --no-tags --depth=1 origin +dev:refs/remotes/origin/dev
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: dev
      - name: Deploy dev
        env:
          ALLOW_ACTIVE: ${{ inputs.allow_active }}
        run: |
          flags=""
          if [ "$ALLOW_ACTIVE" = "true" ]; then flags="--allow-active"; fi
          node tools/ship/quiet.mjs deploy -- cargo xtask deploy --env dev $flags
      - name: Smoke
        run: node tools/ship/quiet.mjs smoke -- cargo xtask infra smoke --env dev
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo
