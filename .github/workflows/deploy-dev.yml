name: Deploy dev
# After CI passes on dev: `cargo xtask deploy --env dev` (dev.yonedarepo.com), then the
# smoke. The deploy guard refuses unless the commit is still the tip of dev, so a newer
# push supersedes an older run instead of racing it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dev
  cancel-in-progress: false
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Fetch the tip of dev for the deploy guard
        run: git fetch --no-tags --depth=1 origin dev:refs/remotes/origin/dev
      # A newer push has its own CI run and deploy; skip quietly instead of failing the guard.
      - name: Skip unless this commit is still the tip of dev
        id: tip
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/dev)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$(git rev-parse --short HEAD) is no longer the tip of dev; its successor deploys."
          fi
      - uses: ./.github/actions/setup
        if: steps.tip.outputs.current == 'true'
      - name: Write the dev secrets file (0600, outside the tree)
        if: steps.tip.outputs.current == 'true'
        env:
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
        run: |
          install -d -m 700 ~/.config/yonedarepo
          umask 077
          printf 'OWNER_TOKEN=%s\nVAULT_KEY=%s\n' "$OWNER_TOKEN" "$VAULT_KEY" > ~/.config/yonedarepo/staging.env
      - name: Deploy dev
        if: steps.tip.outputs.current == 'true'
        run: cargo xtask deploy --env dev | tee deploy.txt
      - name: Smoke
        if: steps.tip.outputs.current == 'true'
        run: cargo xtask infra smoke --env dev | tee smoke.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Deploy dev'; echo '```'; tail -n 12 deploy.txt 2>/dev/null; tail -n 12 smoke.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm -f ~/.config/yonedarepo/staging.env
