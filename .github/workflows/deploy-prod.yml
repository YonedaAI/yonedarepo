name: Deploy prod
# Prod deploys from a merged ship PR (docs/ship-pipeline.md): on the push to main, it finds the
# Ship run that tested the merge's tree, deploys with that run's evidence, publishes the CLI if
# its version is new, runs the prod smoke and watches prod for 30 minutes. Any other push to
# main deploys nothing. By hand (workflow_dispatch, dry run by default) it is a re-run of the
# same steps for main's tip, for instance after the busy-container check stopped a deploy.
#
# xtask refuses unless HEAD is the tip of main, every dev Worker runs its tree, the kit passed
# for its tree and no container instance is busy (a rollout kills runs). `allow_active` exists
# only on the manual form and is never the default. Nothing here rolls back: a repository that
# ran a migration refuses older binaries (SCHEMA_TOO_NEW); the docs have the manual steps.
#
# This repository is public: deploy and kit output go through tools/ship/quiet.mjs, and the
# monitor prints counts only (Superfan mails the details privately).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and check the guards only (wrangler --dry-run)
        type: boolean
        default: true
      allow_active:
        description: Roll containers out even if instances are busy (kills their runs)
        type: boolean
        default: false
permissions:
  contents: read
# One at a time, the monitor included; a deploy is never cancelled part-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  gate:
    name: Ship gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      ship: ${{ steps.find.outputs.ship }}
      pr_head: ${{ steps.find.outputs.pr_head }}
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      # Only the owner, only from main: a merge or a re-run by anyone else stops here.
      - name: Owner-only gate
        if: github.actor != 'MagnetonIO' || github.triggering_actor != 'MagnetonIO' || github.ref != 'refs/heads/main'
        env:
          ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          echo "::error::Refusing: prod deploys run only for MagnetonIO from main (actor $ACTOR, ref $REF)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Find the ship
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ship/find-ship.mjs

  deploy:
    name: Deploy
    needs: gate
    if: needs.gate.outputs.ship == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      started_at: ${{ steps.started.outputs.at }}
      cli_needed: ${{ steps.cli.outputs.needed }}
    env:
      PR_HEAD: ${{ needs.gate.outputs.pr_head }}
      RUN_ID: ${{ needs.gate.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # The guard reads the PR head's tree: the dev Workers and the evidence name that commit.
      - name: Fetch the tip of main and the PR head for the deploy guard
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main "$PR_HEAD"
      - name: Download the Ship run's evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p .local/staging
          gh run download "$RUN_ID" -n "realworld-$tree" -D .local/staging
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Note the start
        id: started
        run: echo "at=$(date +%s)000" >> "$GITHUB_OUTPUT"
      - name: Deploy prod
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_ACTIVE: ${{ inputs.allow_active }}
        run: |
          # A prod deploy reads no token file (the Mac uses wrangler's login): wrangler takes this.
          CLOUDFLARE_API_TOKEN=$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' ~/.config/yonedarepo/deploy-prod.env)
          export CLOUDFLARE_API_TOKEN
          flags=(--confirm)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          if [ "$ALLOW_ACTIVE" = "true" ]; then flags+=(--allow-active); fi
          node tools/ship/quiet.mjs deploy -- cargo xtask deploy --env prod "${flags[@]}"
      - name: Is this CLI version published?
        id: cli
        if: ${{ !inputs.dry_run }}
        run: |
          want=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "yoneda-cli") | .version')
          have=$(curl -fsS --retry 3 https://yonedarepo.com/downloads/cli/LATEST || true)
          if [ "$want" = "$have" ]; then needed=false; else needed=true; fi
          echo "CLI $want, published ${have:-nothing}: publish=$needed"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo

  # macOS: `downloads stage` builds the darwin targets with plain Cargo, the rest with zig.
  downloads:
    name: Publish the CLI
    needs: deploy
    if: needs.deploy.outputs.cli_needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/node
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Cross-compile tools
        env:
          ZIG: zig-aarch64-macos-0.17.0
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$ZIG_URL"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ZIG" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.0 --locked
          rustup target add aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm
      - name: Stage the downloads
        run: node tools/ship/quiet.mjs deploy -- cargo xtask downloads stage --env prod
      - name: Upload the downloads
        run: |
          CLOUDFLARE_API_TOKEN=$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' ~/.config/yonedarepo/deploy-prod.env)
          export CLOUDFLARE_API_TOKEN
          node tools/ship/quiet.mjs deploy -- cargo xtask downloads upload --env prod
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo

  smoke:
    name: Prod smoke
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      # Item 26's ProxyCommand on the tunnel front door.
      - name: Install cloudflared
        env:
          VERSION: 2026.10.7
          SHA256: 70b1a1e0f46033ffc8d90b406e554044ba6cbf2e4360295ef1163aed31e09393
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.deb" "https://github.com/cloudflare/cloudflared/releases/download/$VERSION/cloudflared-linux-amd64.deb"
          echo "$SHA256  $RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
      - name: Build the CLI the smoke drives
        run: cargo build -p yoneda-cli --release --quiet
      - name: Smoke
        run: node tools/ship/quiet.mjs kit -- node tools/staging-realworld.mjs --prod --only 0,browser,26,12,13,14,15,16,17
      - name: Pass table
        if: always()
        run: node tools/ship/evidence.mjs --table prod-smoke || true
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo .local/staging

  monitor:
    name: Monitor (30 minutes)
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Watch prod
        env:
          REVISION: ${{ github.sha }}
          SINCE: ${{ needs.deploy.outputs.started_at }}
        run: node tools/ship/monitor.mjs --revision "$REVISION" --since "$SINCE"
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo
