name: Deploy prod
# Manual only, for the owner (MagnetonIO) from main, in the "production" Environment.
# `cargo xtask deploy --env prod --confirm` refuses unless HEAD is the tip of main, every dev
# Worker already runs it, the real-world kit passed for it (evidence from the Kit workflow)
# and no container instance is busy (rollouts kill runs).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and check the guards only (wrangler --dry-run)
        type: boolean
        default: true
      allow_active:
        description: Roll containers out even if instances are busy (kills their runs)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The org's plan has no required reviewers, so the approval gate is this step: only the
      # owner, only from main.
      - name: Owner-only gate
        if: github.actor != 'MagnetonIO' || github.ref != 'refs/heads/main'
        run: |
          echo "Refusing: prod deploys run only for MagnetonIO from main (actor ${{ github.actor }}, ref ${{ github.ref }})."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Fetch the tip of main for the deploy guard
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Download kit evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run=$(gh run list --workflow kit.yml --status success --json databaseId,headSha \
            --jq "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")
          mkdir -p .local/staging
          if [ -n "$run" ]; then gh run download "$run" -n "realworld-$sha" -D .local/staging; fi
      - uses: ./.github/actions/setup
      - name: Deploy prod
        run: |
          flags="--confirm"
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          if [ "${{ inputs.allow_active }}" = "true" ]; then flags="$flags --allow-active"; fi
          cargo xtask deploy --env prod $flags | tee deploy.txt
      - name: Status
        if: always()
        run: |
          cargo xtask status --env prod | tee status.txt || true
          { echo '### Deploy prod'; echo '```'; tail -n 12 deploy.txt 2>/dev/null; cat status.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
