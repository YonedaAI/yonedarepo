name: Deploy prod
# For later, when development slows: today prod deploys from the owner's checkout
# (`cargo xtask deploy --env prod --confirm`), and this workflow stays disabled on GitHub until
# the owner turns it on (`gh workflow enable deploy-prod.yml`). Manual only, for the owner
# (MagnetonIO) from main, in the "production" Environment; it builds everything from source.
# xtask refuses unless HEAD is the tip of main, every dev Worker already runs it, the
# real-world kit passed for it and no container instance is busy (rollouts kill runs). Kits
# run locally now, so the kit evidence (`realworld-<sha>.json`, in .local/staging/) must
# reach the runner as an artifact named `realworld-<sha>` of the run given as `evidence_run`
# (any workflow run that uploaded it); without it the deploy refuses.
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Run id holding the realworld-<sha> kit evidence artifact for main's tip
        type: string
        default: 
      dry_run:
        description: Plan and check the guards only (wrangler --dry-run)
        type: boolean
        default: true
      allow_active:
        description: Roll containers out even if instances are busy (kills their runs)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The org's plan has no required reviewers, so the approval gate is this step: only the
      # owner, only from main.
      - name: Owner-only gate
        if: github.actor != 'MagnetonIO' || github.ref != 'refs/heads/main'
        run: |
          echo "Refusing: prod deploys run only for MagnetonIO from main (actor ${{ github.actor }}, ref ${{ github.ref }})."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Fetch the tip of main for the deploy guard
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
      - name: Download kit evidence for this commit
        if: inputs.evidence_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.evidence_run }}
        run: |
          sha=$(git rev-parse HEAD)
          mkdir -p .local/staging
          gh run download "$RUN" -n "realworld-$sha" -D .local/staging
      - uses: ./.github/actions/setup
      - name: Deploy prod
        run: |
          flags="--confirm"
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          if [ "${{ inputs.allow_active }}" = "true" ]; then flags="$flags --allow-active"; fi
          cargo xtask deploy --env prod $flags | tee "$RUNNER_TEMP/deploy.txt"
      - name: Status
        if: always()
        run: |
          set +e  # report whatever exists; a missing file is not a failure
          cargo xtask status --env prod | tee "$RUNNER_TEMP/status.txt"
          { echo '### Deploy prod'; echo '```'; tail -n 12 "$RUNNER_TEMP/deploy.txt" 2>/dev/null; cat "$RUNNER_TEMP/status.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
