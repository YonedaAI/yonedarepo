name: Deploy prod
# Prod deploys from a merged ship PR (docs/ship-pipeline.md): on the push to main it finds the
# PR's head, deploys, publishes the CLI if its version is new, runs the runner's smoke and
# watches prod for 30 minutes. Any other push to main deploys nothing. By hand
# (workflow_dispatch, dry run by default) it is a re-run of the same steps for main's tip, for
# instance after the busy-container check stopped a deploy.
#
# `--ship-head` requires the PR head's exact tree and successful CI release validation.
# HEAD must be the tip of main
# and no container instance busy (a rollout kills runs). `allow_active` exists only on the manual
# form and is never the default. Nothing here rolls back: a repository that ran a migration
# refuses older binaries (SCHEMA_TOO_NEW); the docs have the manual steps.
#
# This repository is public: deploy output goes through tools/ship/quiet.mjs, and the monitor
# prints counts only (Superfan mails the details privately).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and check the guards only (wrangler --dry-run)
        type: boolean
        default: true
      allow_active:
        description: Roll containers out even if instances are busy (kills their runs)
        type: boolean
        default: false
permissions:
  contents: read
# One at a time, the monitor included; a deploy is never cancelled part-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  gate:
    name: Ship gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ship: ${{ steps.find.outputs.ship }}
      pr_head: ${{ steps.find.outputs.pr_head }}
    steps:
      # Only the owner, only from main: a merge or a re-run by anyone else stops here.
      - name: Owner-only gate
        if: github.actor != 'MagnetonIO' || github.triggering_actor != 'MagnetonIO' || github.ref != 'refs/heads/main'
        env:
          ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          echo "::error::Refusing: prod deploys run only for MagnetonIO from main (actor $ACTOR, ref $REF)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Find the ship
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ship/find-ship.mjs

  deploy:
    name: Deploy
    needs: gate
    if: needs.gate.outputs.ship == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      actions: read
    outputs:
      started_at: ${{ steps.started.outputs.at }}
      cli_needed: ${{ steps.cli.outputs.needed }}
    env:
      PR_HEAD: ${{ needs.gate.outputs.pr_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # The guard compares the PR head's tree with HEAD's.
      - name: Fetch the tip of main and the PR head for the deploy guard
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main "$PR_HEAD"
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Note the start
        id: started
        run: echo "at=$(date +%s)000" >> "$GITHUB_OUTPUT"
      - name: Deploy prod
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_ACTIVE: ${{ inputs.allow_active }}
        run: |
          # A prod deploy reads no token file (the Mac uses wrangler's login): wrangler takes this.
          CLOUDFLARE_API_TOKEN=$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' ~/.config/yonedarepo/deploy-prod.env)
          export CLOUDFLARE_API_TOKEN
          flags=(--confirm --ship-head "$PR_HEAD")
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          if [ "$ALLOW_ACTIVE" = "true" ]; then flags+=(--allow-active); fi
          node tools/ship/quiet.mjs deploy -- cargo xtask deploy --env prod "${flags[@]}"
      - name: Is this CLI version published?
        id: cli
        if: ${{ !inputs.dry_run }}
        run: |
          want=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "yoneda-cli") | .version')
          have=$(curl -fsS --retry 3 https://yonedarepo.com/downloads/cli/LATEST || true)
          if [ "$want" = "$have" ]; then needed=false; else needed=true; fi
          echo "CLI $want, published ${have:-nothing}: publish=$needed"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo

  # Target builds have no production secrets. Same-run artifacts carry exact-source receipts.
  cli-build:
    name: CLI / ${{ matrix.target }}
    needs: deploy
    if: needs.deploy.outputs.cli_needed == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: darwin-arm64
            triple: aarch64-apple-darwin
            zig: false
          - target: darwin-x64
            triple: x86_64-apple-darwin
            zig: false
          - target: linux-x64
            triple: x86_64-unknown-linux-musl
            zig: true
          - target: linux-arm64
            triple: aarch64-unknown-linux-musl
            zig: true
          - target: windows-x64
            triple: x86_64-pc-windows-gnu
            zig: true
          - target: windows-arm64
            triple: aarch64-pc-windows-gnullvm
            zig: true
    env:
      CLI_TARGET: ${{ matrix.target }}
      RUST_TARGET: ${{ matrix.triple }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/node
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cli-${{ matrix.target }}
          key: ${{ matrix.triple }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          cache-bin: true
      - name: Install the Rust target
        run: rustup target add "$RUST_TARGET"
      - name: Cross-compile tools
        if: matrix.zig
        env:
          ZIG: zig-aarch64-macos-0.17.0
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$ZIG_URL"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ZIG" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - name: Build and package the target
        run: |
          echo "Building CLI archive: $CLI_TARGET"
          node tools/ship/quiet.mjs deploy -- cargo xtask downloads stage --env prod --targets "$CLI_TARGET" --revision "$SOURCE_REVISION"
          echo "CLI archive ready: $CLI_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/downloads/prod/receipt.json
            target/downloads/prod/cli/*/yoneda-*-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # Archives are already compressed.

  downloads:
    name: Publish the CLI
    needs: [deploy, cli-build]
    if: needs.deploy.outputs.cli_needed == 'true' && needs.cli-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/node
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cli-assemble
          key: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*-${{ github.sha }}
          path: target/cli-input
      - name: Assemble the complete release
        run: |
          echo "Verifying the complete CLI archive cohort"
          node tools/ship/quiet.mjs deploy -- cargo xtask downloads assemble --env prod --from target/cli-input --revision "$SOURCE_REVISION"
          echo "Complete CLI release verified"
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Upload the downloads
        run: |
          CLOUDFLARE_API_TOKEN=$(sed -n 's/^CLOUDFLARE_API_TOKEN=//p' ~/.config/yonedarepo/deploy-prod.env)
          export CLOUDFLARE_API_TOKEN
          node tools/ship/quiet.mjs deploy -- cargo xtask downloads upload --env prod
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo

  # What a runner can do without a browser or a kit account: the frontend, every /health at the
  # shipped revision, and the owner's API through the front. The browser, CLI and SSH smoke stay
  # on the Mac (docs/ship-pipeline.md).
  smoke:
    name: Prod smoke
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Smoke
        run: node tools/ship/quiet.mjs smoke -- cargo xtask infra smoke --env prod
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo

  monitor:
    name: Monitor (30 minutes)
    needs: deploy
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - uses: ./.github/actions/env-file
        with:
          content: ${{ secrets.YONEDA_ENV_FILE }}
          env: prod
      - name: Watch prod
        env:
          REVISION: ${{ github.sha }}
          SINCE: ${{ needs.deploy.outputs.started_at }}
        run: node tools/ship/monitor.mjs --revision "$REVISION" --since "$SINCE"
      - name: Remove the secrets files
        if: always()
        run: rm -rf ~/.config/yonedarepo
