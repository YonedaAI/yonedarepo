name: Nightly
# The deep differential: 100 random sequences of 200 operations against the reference model
# (repo_store/tests/differential.rs), ignored in every other run because it takes minutes. It
# tests dev, where a defect can still be fixed before a ship, and each night takes seeds no
# earlier night used: the same seeds on the same commit would prove nothing new. A failure
# names its seed, and `YONEDA_DIFF_SEED=<seed>` replays it. GitHub runs a schedule from the
# default branch only, so this starts once the file reaches main.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  differential:
    name: Deep differential
    if: github.repository == 'YonedaAI/yonedarepo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: nightly
      - name: 100 sequences of 200 operations
        env:
          YONEDA_DIFF_SEED_START: ${{ github.run_number }}00
        run: cargo test -p yoneda-platform --lib differential -- --ignored
