name: Ship
# The ship's CI, on the pull request from dev to main (docs/ship-pipeline.md). The owner says
# "ship", the full kit passes locally and `cargo xtask live-tests` marks that commit; then the
# PR is opened. This workflow runs Check and Full suite and never deploys or reaches a secret;
# merging the PR deploys prod (deploy-prod.yml), which requires this run's success.
#
# The same-repository condition keeps forks out of the ship; pull_request_target is never used.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
# One ship at a time: a newer push to dev replaces the run.
concurrency:
  group: ship
  cancel-in-progress: true
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  gate:
    name: Ship gate
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GitHub's test merge and the PR head: the kit tested the head, Check and Full test the merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: The merge must not change the tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$PR_HEAD^{tree}")" ]; then
            echo "::error::main has changes dev lacks, so the merge is not the tree this ship would test. Merge main into dev."
            exit 1
          fi

  check:
    needs: gate
    uses: ./.github/workflows/ci.yml
    with:
      ship: true

  full:
    needs: gate
    uses: ./.github/workflows/full.yml
    with:
      ship: true
