name: Ephemeral stack
# Proves a full stack comes up from zero: `infra up --env ephemeral-ci<run>` on workers.dev
# with its own resources, the smoke, then `infra down --purge` (always, even on failure).
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ephemeral
  cancel-in-progress: false
jobs:
  ephemeral:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STACK: ephemeral-ci${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Up
        run: cargo xtask infra up --env "$STACK" | tee up.txt
      - name: Smoke
        run: cargo xtask infra smoke --env "$STACK" | tee smoke.txt
      - name: Down (purge)
        if: always()
        run: cargo xtask infra down --env "$STACK" --confirm --purge | tee down.txt
      - name: Summary
        if: always()
        run: |
          { echo "### $STACK"; echo '```'; tail -n 8 up.txt 2>/dev/null; cat smoke.txt 2>/dev/null; tail -n 4 down.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
