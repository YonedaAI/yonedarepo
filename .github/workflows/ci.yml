name: Check
# The fast gate, on every pull request and push to main (and by hand): one job, one runner,
# warm cargo and pnpm caches, about ten minutes. Lint, types and the unit tests of each crate,
# the Worker Wasm build, the frontend and runtime suites. The workerd suites, the platform and
# superfan Workers, the frontend build and the runtime image run in "Full suite" (full.yml),
# by hand before a prod ship; together they are `cargo xtask check` (xtask/src/commands.rs),
# so keep both workflows in step with its arm. Nothing here deploys: dev and prod deploy from
# the owner's checkout (deploy-dev.yml and deploy-prod.yml are manual and off).
on:
  # Documentation-only changes (docs/, Markdown anywhere, the site's content) run nothing.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'frontend/src/content/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'frontend/src/content/**']
  workflow_dispatch:
permissions:
  contents: read
# One run per branch or PR: a newer push cancels the older run of the same ref.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Registry, git deps, target/ (both workspaces) and ~/.cargo/bin (worker-build), saved
      # after every run so the next builds only what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          cache-bin: true
          workspaces: |
            .
            backend/crates/yoneda-ssh-gateway
      - uses: ./.github/actions/node
      - run: cargo xtask layers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Unit tests only: no ignored tests and no integration tests (those start workerd).
      - run: cargo test -p yoneda-core -p yoneda-store -p yoneda-platform -p yoneda-cli -p yoneda-refmodel --lib
      - run: cargo test -p xtask --bins
      # The SSH gateway is its own workspace (backend/crates/yoneda-ssh-gateway/Cargo.toml).
      - run: cargo fmt --check --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - run: cargo clippy --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - name: Install Worker build tool
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked
      # Before the TypeScript checks: the Worker types import its build.
      - name: worker-build --release
        working-directory: backend/crates/yoneda-worker
        run: worker-build --release
      # tsc of the Workers and biome, then tsc of the frontend.
      - run: pnpm check
      - run: pnpm --dir frontend exec tsc -b
      - run: pnpm test:frontend
      - run: pnpm test:runtime
