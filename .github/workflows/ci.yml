name: Check
# The fast gate, on every pull request and push to main (and by hand): one job, one runner,
# warm cargo and pnpm caches, about ten minutes. Lint, types and the unit tests of each crate,
# the health gates (docs/code-health.md), the Worker Wasm build, the frontend and runtime
# suites. The workerd suites, the platform and superfan Workers and the runtime image run in
# "Full suite" (full.yml), in the ship or by hand; together they are `cargo xtask check`
# (xtask/src/commands.rs), so keep both workflows in step with its arm. Nothing here deploys.
# A ship PR (dev to main) runs this through ship.yml, not on its own, so it runs once.
on:
  # Documentation-only changes (docs/, Markdown anywhere, the site's content) run nothing.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'frontend/src/content/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'frontend/src/content/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ship:
        description: Called by ship.yml
        type: boolean
        default: false
permissions:
  contents: read
# One run per branch or PR: a newer push cancels the older run of the same ref. Ship's call has
# its own group, because a run on the same PR would otherwise cancel it.
concurrency:
  group: check-${{ inputs.ship && 'ship' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Check
    # A fork's branch named dev is no ship PR: its run stays here.
    if: >-
      inputs.ship ||
      github.event_name != 'pull_request' ||
      github.head_ref != 'dev' ||
      github.base_ref != 'main' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the health gates compare with the commit this change starts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Registry, git deps, target/ (both workspaces) and ~/.cargo/bin (worker-build), saved
      # after every run so the next builds only what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          cache-bin: true
          workspaces: |
            .
            backend/crates/yoneda-ssh-gateway
      - uses: ./.github/actions/node
      - run: cargo xtask layers
      # Before the xtask tests, which plant a fake secret and need the real scanner. The release
      # binary and its checksum: gitleaks-action needs a license for an organization.
      - name: Install gitleaks
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The commit a pull request or push starts from; empty or all zeros on a new branch or a
      # manual run. The scan covers that range alone, and prints a rule and a place: never a
      # value, an author or an email, because these logs are public.
      - name: Health gates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo xtask health lines --base "$BASE"
          cargo xtask health migrations --base "$BASE"
          cargo xtask health secrets --base "$BASE"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Unit tests only: no ignored tests and no integration tests (those start workerd).
      - run: cargo test -p yoneda-core -p yoneda-store -p yoneda-platform -p yoneda-cli -p yoneda-refmodel --lib
      - run: cargo test -p xtask --bins
      # The SSH gateway is its own workspace (backend/crates/yoneda-ssh-gateway/Cargo.toml).
      - run: cargo fmt --check --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - run: cargo clippy --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - name: Install Worker build tool
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked
      # Before the TypeScript checks: the Worker types import its build.
      - name: worker-build --release
        working-directory: backend/crates/yoneda-worker
        run: worker-build --release
      # tsc of the Workers and biome, then tsc of the frontend.
      - run: pnpm check
      - run: pnpm --dir frontend exec tsc -b
      # For the size budget, which also reads the Wasm built above.
      - run: pnpm --dir frontend build
      - run: cargo xtask health size
      - run: pnpm test:frontend
      - run: pnpm test:runtime
