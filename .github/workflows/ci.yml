name: CI
# The parts of `cargo xtask check` (the local gate) as parallel jobs, plus the runtime image.
# Keep the job list in step with the `check` arm in xtask/src/commands.rs.
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
# Pushes to dev/main all finish (deploy-dev waits for a CI success); PR runs supersede.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: Worker Wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: wasm-${{ runner.os }}-
      - name: Install Worker build tool
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked
      - name: worker-build --release
        working-directory: backend/crates/yoneda-worker
        run: worker-build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
          if-no-files-found: error
          retention-days: 1

  workers:
    name: Workers suite (workerd)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      - run: pnpm test

  suites:
    name: Types, lint, other suites, frontend build
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      - run: pnpm check
      - run: pnpm test:apps
      # The source platform must pass on its own, with the agent layer switched off.
      - run: pnpm test:platform
      - run: pnpm test:superfan
      - run: pnpm test:eval
      - run: pnpm test:runtime
      - run: pnpm test:frontend
      - run: pnpm --dir frontend build

  image:
    name: Runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native execution image
        run: docker build --platform linux/amd64 -f cloudflare/containers/Dockerfile -t yonedarepo-runtime:ci .
      - name: Verify Gemini CLI and Rust MCP without inference
        run: docker run --rm --network none -i --entrypoint python3 yonedarepo-runtime:ci - < tests/container/gemini_smoke.py
