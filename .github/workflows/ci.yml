name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '11.16.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Worker build tool
        run: cargo install worker-build --version 0.8.7 --locked
      - name: Verify native, Wasm, workerd and browser
        run: cargo xtask check
      - name: Build native execution image
        run: docker build --platform linux/amd64 -f containers/Dockerfile -t yonedarepo-runtime:ci .
