name: CI
# One secret-free validation DAG: fast checks on ordinary PRs/main, full release validation
# on same-repository dev-to-main PRs, and an explicit manual full option. This file keeps
# dependency/aggregate guards together so a skipped or failed full job cannot bless a release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full release validation without deploying
        type: boolean
        default: false
      image:
        description: Force the runtime image build when full validation is selected
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
      full: ${{ (github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.full) }}
      check: ${{ steps.paths.outputs.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Select the fast checks (release and manual validation always run them)
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          FORCE: ${{ (github.event_name == 'pull_request' && github.head_ref == 'dev' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}
        run: node tools/ship/ci-scope.mjs

  ship-tree:
    name: Release merge tree
    needs: scope
    if: needs.scope.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: The merge must not change the tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "$PR_HEAD^{tree}")" ]; then
            echo "::error::main has changes dev lacks. Merge main into dev before release validation."
            exit 1
          fi

  check:
    name: Check
    needs: [scope, wasm]
    if: ${{ !cancelled() && needs.scope.outputs.check == 'true' && (needs.wasm.result == 'success' || (needs.scope.outputs.full != 'true' && needs.wasm.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the health gates compare with the commit this change starts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Registry, git deps, target/ (both workspaces) and ~/.cargo/bin (worker-build), saved
      # after every run so the next builds only what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          cache-bin: true
          workspaces: |
            .
            backend/crates/yoneda-ssh-gateway
      - uses: ./.github/actions/node
      - run: cargo xtask layers
      # Before the xtask tests, which plant a fake secret and need the real scanner. The release
      # binary and its checksum: gitleaks-action needs a license for an organization.
      - name: Install gitleaks
        run: |
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The commit a pull request or push starts from; empty or all zeros on a new branch or a
      # manual run. The scan covers that range alone, and prints a rule and a place: never a
      # value, an author or an email, because these logs are public.
      - name: Health gates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo xtask health lines --base "$BASE"
          cargo xtask health migrations --base "$BASE"
          cargo xtask health secrets --base "$BASE"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Unit tests only: no ignored tests and no integration tests (those start workerd).
      - run: cargo test -p yoneda-core -p yoneda-store -p yoneda-platform -p yoneda-cli -p yoneda-refmodel --lib
      - run: cargo test -p xtask --bins
      # The SSH gateway is its own workspace (backend/crates/yoneda-ssh-gateway/Cargo.toml).
      - run: cargo fmt --check --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - run: cargo clippy --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - name: Install Worker build tool
        if: needs.scope.outputs.full != 'true'
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked
      # Fast checks build locally; full validation consumes its one tested Wasm artifact.
      - name: worker-build --release
        if: needs.scope.outputs.full != 'true'
        working-directory: backend/crates/yoneda-worker
        run: worker-build --release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.scope.outputs.full == 'true'
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      # tsc of the Workers and biome, then tsc of the frontend.
      - run: pnpm check
      - run: pnpm --dir frontend exec tsc -b
      # For the size budget, which also reads the Wasm built above.
      - run: pnpm --dir frontend build
      - run: cargo xtask health size
      - run: pnpm test:frontend
      - run: pnpm test:runtime

  wasm:
    name: full / Worker Wasm build
    needs: [scope, ship-tree]
    if: ${{ !cancelled() && needs.scope.outputs.full == 'true' && (needs.ship-tree.result == 'success' || needs.ship-tree.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
          # The pinned build tool lives in ~/.cargo/bin, which the cache keeps.
          cache-bin: true
      - name: Install Worker build tool
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked
      - name: worker-build --release
        working-directory: backend/crates/yoneda-worker
        run: worker-build --release
      # The workerd suites below test this build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
          if-no-files-found: error
          retention-days: 1

  # Canonical platform tests, partitioned across four runners. The selector keeps routine
  # coverage disjoint from the residual main suite; scale tests remain explicit commands.
  workers:
    name: full / Platform suite (workerd ${{ matrix.shard }}/4)
    needs: [scope, wasm]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      # Naming reporters replaces the CI defaults, so default and github-actions are listed.
      - run: >-
          node tools/ci/workers.mjs platform --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json="$RUNNER_TEMP/workers-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workers-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/workers-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  workers-total:
    name: full / Platform suite total
    needs: [scope, workers]
    if: always() && needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workers-results-*
          path: results
          merge-multiple: true
      - name: Add up the shards in the job summary
        run: |
          shopt -s nullglob
          files=(results/workers-*.json)
          counts='{files: (.testResults | length), tests: .numTotalTests, passed: .numPassedTests,
            failed: .numFailedTests, skipped: (.numPendingTests + .numTodoTests)}'
          row='"| \(.files) | \(.tests) | \(.passed) | \(.failed) | \(.skipped) |"'
          {
            echo "### Platform suite (workerd): ${#files[@]} of 4 shards reported"
            echo
            echo '| Shard | Files | Tests | Passed | Failed | Skipped |'
            echo '| --- | --- | --- | --- | --- | --- |'
            for f in "${files[@]}"; do
              shard=${f##*workers-}; shard=${shard%.json}
              echo "| $shard/4 $(jq -r "$counts | $row" "$f")"
            done
            if [ "${#files[@]}" -gt 0 ]; then
              echo "| **total** $(jq -rs "map($counts) | reduce .[] as \$x ({}; reduce (\$x | keys[]) as \$k (.; .[\$k] += \$x[\$k])) | $row" "${files[@]}")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Only ${#files[@]} of 4 workerd shards reported results."
            exit 1
          fi
          # The summary must never look green while a shard failed.
          if [ "${{ needs.workers.result }}" != success ]; then
            echo "::error::A workerd shard failed (${{ needs.workers.result }})."
            exit 1
          fi

  suites:
    name: full / Compatibility, storage, superfan and managed agents Workers
    needs: [scope, wasm]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      # Main-worker compatibility and account/OAuth cases not covered by platform shards.
      - run: node tools/ci/workers.mjs main
      - run: pnpm test:storage-full
      - run: pnpm test:superfan
      - run: pnpm test:managed

  # The CheckContainer image must build. Layers are cached in the GitHub Actions cache; the
  # image is checked, not kept (no load, no push). It builds only when its directories
  # changed since main (cloudflare/containers, backend/crates/yoneda-runtime) or `image` is set.
  image:
    name: full / Runtime image
    needs: [scope, ship-tree]
    if: ${{ !cancelled() && needs.scope.outputs.full == 'true' && (needs.ship-tree.result == 'success' || needs.ship-tree.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the change check needs main's merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the image needs a build
        id: wanted
        env:
          ASKED: ${{ inputs.image }}
        run: |
          if [ "$ASKED" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet origin/main...HEAD -- cloudflare/containers backend/crates/yoneda-runtime; then
            echo "::notice::The runtime image's directories are unchanged since main; not building it (run with image to force)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.wanted.outputs.build == 'true'
      - name: Build check image
        if: steps.wanted.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: cloudflare/containers/Dockerfile
          platforms: linux/amd64
          # The same flags wrangler builds with.
          provenance: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max,ignore-error=true

  ship-gate:
    name: Ship gate
    needs: [scope, ship-tree, check, wasm, workers-total, suites, image]
    if: >-
      always() && github.event_name == 'pull_request' && github.head_ref == 'dev' &&
      github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
      - name: Require every release validation job
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ship/ci-scope.mjs --gate
