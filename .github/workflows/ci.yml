name: CI
# The parts of `cargo xtask check` (the local gate) as parallel jobs, plus the runtime image
# build. Keep the job list in step with the `check` arm in xtask/src/commands.rs. CI only
# tests: dev deploys from the local checkout (`cargo xtask deploy --env dev`, AGENTS.md), so
# a push to dev runs nothing here; run CI on dev by hand with workflow_dispatch.
on:
  # Documentation-only changes (docs/, Markdown anywhere, the site's content) run nothing.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'frontend/src/content/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'frontend/src/content/**']
  workflow_dispatch:
permissions:
  contents: read
# One run per branch or PR: a newer push cancels the older run of the same ref.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# An explicit bash shell runs with -eo pipefail, so `cmd | tee` fails when cmd fails.
defaults:
  run:
    shell: bash
jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Registry, git deps and target/, keyed on the lockfiles and toolchain; saved after every
      # run (pruned of this workspace's own artifacts) so later runs build only what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          workspaces: |
            .
            backend/crates/yoneda-ssh-gateway
      - run: cargo xtask layers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The SSH gateway is its own workspace (backend/crates/yoneda-ssh-gateway/Cargo.toml).
      - run: cargo fmt --check --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml
      - run: cargo clippy --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path backend/crates/yoneda-ssh-gateway/Cargo.toml

  wasm:
    name: Worker Wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
          # The pinned build tool lives in ~/.cargo/bin, which the cache keeps.
          cache-bin: true
      - name: Install Worker build tool
        run: command -v worker-build >/dev/null || cargo install worker-build --version 0.8.7 --locked
      - name: worker-build --release
        working-directory: backend/crates/yoneda-worker
        run: worker-build --release
      # The workerd suites below test this build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
          if-no-files-found: error
          retention-days: 1

  # The workerd suite split by file across four runners (vitest --shard), each with the
  # config's own worker cap. workers-total adds up the counts.
  workers:
    name: Workers suite (workerd ${{ matrix.shard }}/4)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      # Naming reporters replaces the CI defaults, so default and github-actions are listed.
      - run: >-
          pnpm test --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json="$RUNNER_TEMP/workers-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: workers-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/workers-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 1

  workers-total:
    name: Workers suite total
    needs: workers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workers-results-*
          path: results
          merge-multiple: true
      - name: Add up the shards in the job summary
        run: |
          shopt -s nullglob
          files=(results/workers-*.json)
          counts='{files: (.testResults | length), tests: .numTotalTests, passed: .numPassedTests,
            failed: .numFailedTests, skipped: (.numPendingTests + .numTodoTests)}'
          row='"| \(.files) | \(.tests) | \(.passed) | \(.failed) | \(.skipped) |"'
          {
            echo "### Workers suite (workerd): ${#files[@]} of 4 shards reported"
            echo
            echo '| Shard | Files | Tests | Passed | Failed | Skipped |'
            echo '| --- | --- | --- | --- | --- | --- |'
            for f in "${files[@]}"; do
              shard=${f##*workers-}; shard=${shard%.json}
              echo "| $shard/4 $(jq -r "$counts | $row" "$f")"
            done
            if [ "${#files[@]}" -gt 0 ]; then
              echo "| **total** $(jq -rs "map($counts) | reduce .[] as \$x ({}; reduce (\$x | keys[]) as \$k (.; .[\$k] += \$x[\$k])) | $row" "${files[@]}")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#files[@]}" -ne 4 ]; then
            echo "::error::Only ${#files[@]} of 4 workerd shards reported results."
            exit 1
          fi
          # The summary must never look green while a shard failed.
          if [ "${{ needs.workers.result }}" != success ]; then
            echo "::error::A workerd shard failed (${{ needs.workers.result }})."
            exit 1
          fi

  suites:
    name: Types, lint, other suites, frontend build
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-wasm
          path: backend/crates/yoneda-worker/build
      - run: pnpm check
      # The source platform must pass on its own, in its platform-only test Worker.
      - run: pnpm test:platform
      - run: pnpm test:superfan
      - run: pnpm test:runtime
      - run: pnpm test:frontend
      - run: pnpm --dir frontend build

  # The CheckContainer image must build. Layers are cached in the GitHub Actions cache, so an
  # unchanged image takes about a minute; the image is checked, not kept (no load, no push).
  image:
    name: Runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build check image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: cloudflare/containers/Dockerfile
          platforms: linux/amd64
          # The same flags wrangler builds with.
          provenance: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max,ignore-error=true
