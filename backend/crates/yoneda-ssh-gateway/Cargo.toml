# Its own workspace (and Cargo.lock): the gateway image builds from this directory alone,
# and the platform workspace's manifest and lockfile (inputs of the CheckContainer runtime
# image, xtask/src/deploy_inputs.rs) stay untouched by its dependencies.
[workspace]

[package]
name = "yoneda-ssh-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
description = "SSH front end for stock Git: authenticates keys with the platform and bridges git-upload-pack/git-receive-pack onto smart HTTP."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
russh = "0.65"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync", "signal", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
hmac = "0.13"
base64 = "0.23.1"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std", "registry"] }

[profile.release]
lto = true
strip = "debuginfo"

[dev-dependencies]
# Synthetic P-256 host keys in tests (the version russh's ssh-key already uses).
p256 = "0.14"
