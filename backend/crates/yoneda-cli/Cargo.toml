[package]
name = "yoneda-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline client for the YonedaRepo source platform: clone, commit with plain Git, sync later."

[[bin]]
name = "yoneda"
path = "src/main.rs"

# An external API client: it shares only the Git object model, never platform or
# agent-layer internals.
[dependencies]
yoneda-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.23.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
