[package]
name = "yoneda-local"
version.workspace = true
edition.workspace = true
license.workspace = true

# The local repository service: the platform's repository engine (`yoneda-platform`) on the
# native SQLite store, with a bare Git repository as its object store, served to stock Git
# over loopback smart HTTP. It hosts the engine; it holds no publication or conflict rules
# of its own (docs/local-repository-future.md).
[[bin]]
name = "yoneda-local"
path = "src/main.rs"

[dependencies]
yoneda-core.workspace = true
yoneda-store = { workspace = true, features = ["native"] }
yoneda-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.23.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
