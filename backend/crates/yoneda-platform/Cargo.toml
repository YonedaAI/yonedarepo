[package]
name = "yoneda-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

# The source platform's authorities and stateless compute. It depends on core contracts and
# the store contract only (never on yoneda-runtime or the Worker adapters);
# tests/runtime/platform-boundary.test.mjs enforces this.
[dependencies]
yoneda-core.workspace = true
yoneda-store.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
base64 = "0.23.1"
sha2.workspace = true
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
subtle = "2.6.1"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
oxc_parser = "0.155.0"
oxc_ast = "0.155.0"
oxc_allocator = "0.155.0"
oxc_span = "0.155.0"

[dev-dependencies]
yoneda-store = { workspace = true, features = ["native"] }
