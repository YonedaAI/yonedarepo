[package]
name = "yoneda-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
schemars.workspace = true
base64 = "0.23.1"
# Pure-Rust, wasm-safe Git object hashing and zlib for server-side commits.
sha1 = "0.11.0"
miniz_oxide = "0.9.1"
# Histogram line diffs for patches and three-way merge; wasm-safe, no default features.
imara-diff = { version = "0.2.0", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
