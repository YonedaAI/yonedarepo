[package]
name = "yoneda-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
native = ["dep:rusqlite", "yoneda-store/native"]

[dependencies]
yoneda-core.workspace = true
yoneda-agents-core.workspace = true
yoneda-store.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
subtle = "2.6.1"
hmac = "0.13.0"
sha2.workspace = true
base64 = "0.23.1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[dev-dependencies]
yoneda-store = { workspace = true, features = ["native"] }
rusqlite = { version = "0.40", features = ["bundled"] }
