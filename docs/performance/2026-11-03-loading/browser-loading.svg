<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc"><title id="title">Dev browser loading improves, with cold and optional work still open</title><desc id="desc">Three samples per condition, before and current medians with full ranges. Fresh loading remains above its target; optional activity did not improve. No writer benchmark or global claim.</desc><style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1600" height="1400" fill="#101010"/><path d="M72 50V80M72 64L94 78" fill="none" stroke="#00dc8b" stroke-width="4"/><g fill="#101010" stroke="#00dc8b" stroke-width="4"><circle cx="72" cy="48" r="7"/><circle cx="72" cy="82" r="5"/><circle cx="97" cy="79" r="6"/></g><text x="120" y="80" font-size="32" fill="#f5f5f5" font-weight="700">YonedaRepo</text><text x="1512" y="78" font-size="22" fill="#b9b9b9" text-anchor="end">2026-11-03 · DEV BROWSER LOADS</text><text x="72" y="172" font-size="58" fill="#f5f5f5" font-weight="700">Faster repeat views.</text><text x="72" y="230" font-size="42" fill="#edbc5d" font-weight="600">Fresh loading still needs work.</text><text x="72" y="277" font-size="25" fill="#b9b9b9" >One client, one retained repository. Normal browser caches. Three runs per condition.</text><rect x="72" y="314" width="464" height="156" rx="12" fill="#1b1b1b" stroke="#3b3b3b"/><text x="96" y="354" font-size="24" fill="#b9b9b9" >Workspace startup JavaScript</text><text x="96" y="411" font-size="46" fill="#00dc8b" font-weight="700">32.6% less</text><text x="96" y="446" font-size="20" fill="#b9b9b9" >Controlled gzip build comparison</text><rect x="560" y="314" width="464" height="156" rx="12" fill="#1b1b1b" stroke="#3b3b3b"/><text x="584" y="354" font-size="24" fill="#b9b9b9" >Fresh Overview content</text><text x="584" y="411" font-size="46" fill="#00dc8b" font-weight="700">730 ms</text><text x="584" y="446" font-size="20" fill="#b9b9b9" >