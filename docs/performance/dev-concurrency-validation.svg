<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Three bursts. Correct readbacks.</title><desc id="desc">Three independent bursts, each with 1,000 concurrent token writers and 1,000 reads. All 3,000 commits, landings and readbacks succeeded across the runs. This does not establish subsecond latency under load or production acceptance.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="0" y="0" width="1600" height="1200" fill="#101010" />
<path d="M72 50V80M72 64L94 78" fill="none" stroke="#00dc8b" stroke-width="4"/>
<g fill="#101010" stroke="#00dc8b" stroke-width="4"><circle cx="72" cy="48" r="7"/><circle cx="72" cy="82" r="5"/><circle cx="97" cy="79" r="6"/></g>
<text x="120" y="80" font-size="32" fill="#f5f5f5" font-weight="700">YonedaRepo</text>
<text x="1512" y="78" font-size="22" fill="#b9b9b9" text-anchor="end">2026-11-03 · DEV VALIDATION</text>
<text x="72" y="178" font-size="57" fill="#f5f5f5" font-weight="700">Three bursts. Correct readbacks.</text>
<text x="72" y="233" font-size="28" fill="#b9b9b9" >Independent 1,000-writer token tests · dev b38706d6</text>
<rect x="72" y="278" width="464" height="185" fill="#1b1b1b" rx="12" stroke="#3b3b3b"/><text x="497" y="365" font-size="66" fill="#00dc8b" text-anchor="end" font-weight="600" data-metric="commits_ok" data-value="3000">3,000</text><text x="100" y="420" font-size="28" fill="#f5f5f5" >Commits accepted</text><rect x="560" y="278" width="464" height="185" fill="#1b1b1b" rx="12" stroke="#3b3b3b"/><text x="985" y="365" font-size="66" fill="#00dc8b" text-anchor="end" font-weight="600" data-metric="landings_ok" data-value="3000">3,000</text><text x="588" y="420" font-size="28" fill="#f5f5f5" >Landings accepted</text><rect x="1048" y="278" width="464" height="185" fill="#1b1b1b" rx="12" stroke="#3b3b3b"/><text x="1473" y="365" font-size="66" fill="#00dc8b" text-anchor="end" font-weight="600" data-metric="readbacks_correct" data-value="3000">3,000</text><text x="1076" y="420" font-size="28" fill="#f5f5f5" >Correct readbacks</text><text x="72" y="503" font-size="25" fill="#b9b9b9" >Totals across three independent runs</text><rect x="72" y="540" width="1440" height="310" fill="#1b1b1b" rx="12" stroke="#3b3b3b"/><text x="96" y="586" font-size="31" fill="#f5f5f5" font-weight="600">Client read p95</text><text x="1482" y="586" font-size="24" fill="#b9b9b9" text-anchor="end">1,000 read samples per run · milliseconds</text><text x="96" y="654" font-size="27" fill="#f5f5f5" >Run 1 · 1,000 writers</text><rect x="550" y="625" width="900" height="34" fill="#292929" rx="4"/><rect x="550" y="625" width="838.8000000000001" height="34" fill="#00dc8b" rx="4" data-bar="run-1-p95" data-scale-max="3000"/><text x="1482" y="654" font-size="30" fill="#f5f5f5" text-anchor="end" font-weight="600" data-metric="run-1-p95" data-value="2796">2,796</text><text x="96" y="728" font-size="27" fill="#f5f5f5" >Run 2 · 1,000 writers</text><rect x="550" y="699" width="900" height="34" fill="#292929" rx="4"/><rect x="550" y="699" width="793.1999999999999" height="34" fill="#00dc8b" rx="4" data-bar="run-2-p95" data-scale-max="3000"/><text x="1482" y="728" font-size="30" fill="#f5f5f5" text-anchor="end" font-weight="600" data-metric="run-2-p95" data-value="2644">2,644</text><text x="96" y="802" font-size="27" fill="#f5f5f5" >Run 3 · 1,000 writers</text><rect x="550" y="773" width="900" height="34" fill="#292929" rx="4"/><rect x="550" y="773" width="519.6" height="34" fill="#00dc8b" rx="4" data-bar="run-3-p95" data-scale-max="3000"/><text x="1482" y="802" font-size="30" fill="#f5f5f5" text-anchor="end" font-weight="600" data-metric="run-3-p95" data-value="1732">1,732</text><text x="550" y="836" font-size="21" fill="#b9b9b9" text-anchor="middle">0</text><text x="850" y="836" font-size="21" fill="#b9b9b9" text-anchor="middle">1,000</text><text x="1150" y="836" font-size="21" fill="#b9b9b9" text-anchor="middle">2,000</text><text x="1450" y="836" font-size="21" fill="#b9b9b9" text-anchor="middle">3,000</text><text x="72" y="910" font-size="31" fill="#f5f5f5" >Run p95 summary: 1,732 / 2,644 / 2,796 ms</text><text x="72" y="952" font-size="25" fill="#b9b9b9" >Across-run minimum / median / maximum; not a pooled p95.</text><text x="72" y="1016" font-size="27" fill="#00dc8b" >Temporary writer tokens revoked · dedicated fixtures retained</text><text x="72" y="1064" font-size="27" fill="#b9b9b9" >1,000 concurrent writers per run; never 3,000 at once.</text><text x="72" y="1110" font-size="27" fill="#b9b9b9" >Read p95 exceeds one second. These tests use token clients.</text><text x="72" y="1156" font-size="27" fill="#b9b9b9" >Scope excludes real-agent, native-Git and production acceptance.</text></svg>
