[workspace]
members = ["backend/crates/yoneda-core", "backend/crates/yoneda-store", "backend/crates/yoneda-platform", "backend/crates/yoneda-cloudflare", "backend/crates/yoneda-worker", "backend/crates/yoneda-runtime", "backend/crates/yoneda-cli", "backend/crates/yoneda-refmodel", "xtask"]
exclude = ["fixtures/retry-client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
schemars = "1"
yoneda-core = { path = "backend/crates/yoneda-core" }
yoneda-store = { path = "backend/crates/yoneda-store" }
yoneda-platform = { path = "backend/crates/yoneda-platform" }
yoneda-cloudflare = { path = "backend/crates/yoneda-cloudflare" }
yoneda-refmodel = { path = "backend/crates/yoneda-refmodel" }
yoneda-cli = { path = "backend/crates/yoneda-cli" }

[profile.release]
lto = true
opt-level = "s"
# wasm-bindgen requires target_features metadata. Strip debug sections only.
strip = "debuginfo"
